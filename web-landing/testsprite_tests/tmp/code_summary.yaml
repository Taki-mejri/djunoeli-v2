version: "2"
type: frontend
tech_stack:
  - TypeScript
  - React
  - Vite
  - React Router
  - Zustand (auth state)
  - TanStack React Query
  - Axios
routes:
  - path: /
    file: src/pages/LandingPage.tsx
    auth_required: false
    description: Public marketing landing page
  - path: /admin/login
    file: src/pages/auth/LoginPage.tsx
    auth_required: false
    description: Login page for admin/back-office roles (SUPER_ADMIN, OPERATIONS_MANAGER, FINANCE_MANAGER, WAREHOUSE_MANAGER, CUSTOMER_SUPPORT)
  - path: /expediteur/login
    file: src/pages/auth/LoginPage.tsx
    auth_required: false
    description: Login page for EXPEDITEUR (sender/business) role
  - path: /livreur/login
    file: src/pages/auth/LoginPage.tsx
    auth_required: false
    description: Login page for LIVREUR (driver) role
  - path: /dispatch/login
    file: src/pages/auth/LoginPage.tsx
    auth_required: false
    description: Login page for DISPATCHER (warehouse operator) role
  - path: /finance/login
    file: src/pages/auth/LoginPage.tsx
    auth_required: false
    description: Login page for FINANCE_MANAGER / SUPER_ADMIN finance space
  - path: /admin
    file: src/pages/admin/AdminDashboard.tsx
    auth_required: true
    description: Admin dashboard overview
  - path: /admin/shipments
    file: src/pages/admin/ShipmentsPage.tsx
    auth_required: true
    description: Admin list of all shipments
  - path: /admin/shipments/:id
    file: src/pages/admin/ShipmentDetailPage.tsx
    auth_required: true
    description: Admin shipment detail, timeline, cancel action
  - path: /admin/assignments
    file: src/pages/admin/AssignmentsPage.tsx
    auth_required: true
    description: Assign shipments to drivers
  - path: /admin/tracking
    file: src/pages/admin/TrackingPage.tsx
    auth_required: true
    description: Shipment tracking view
  - path: /admin/drivers
    file: src/pages/admin/DriversPage.tsx
    auth_required: true
    description: Driver (livreur) CRUD management
  - path: /admin/expediteurs
    file: src/pages/admin/ExpediteursPage.tsx
    auth_required: true
    description: Expediteur (sender) CRUD management
  - path: /admin/customers
    file: src/pages/admin/CustomersPage.tsx
    auth_required: true
    description: Customers listing
  - path: /admin/warehouses
    file: src/pages/admin/WarehousesPage.tsx
    auth_required: true
    description: Warehouse management
  - path: /admin/cod
    file: src/pages/admin/CodPage.tsx
    auth_required: true
    description: Admin COD overview
  - path: /admin/invoices
    file: src/pages/admin/InvoicesPage.tsx
    auth_required: true
    description: Admin invoices listing
  - path: /admin/reports
    file: src/pages/admin/ReportsPage.tsx
    auth_required: true
    description: Admin reports/analytics
  - path: /admin/finance
    file: src/pages/admin/AdminFinanceOverviewPage.tsx
    auth_required: true
    description: Admin view of the finance overview
  - path: /admin/support
    file: src/pages/admin/SupportPage.tsx
    auth_required: true
    description: Support tickets page
  - path: /admin/settings
    file: src/pages/admin/SettingsPage.tsx
    auth_required: true
    description: Admin/company settings
  - path: /expediteur
    file: src/pages/expediteur/ExpediteurDashboard.tsx
    auth_required: true
    description: Expediteur dashboard overview
  - path: /expediteur/new
    file: src/pages/expediteur/CreateShipmentPage.tsx
    auth_required: true
    description: Create a new shipment with live price estimation
  - path: /expediteur/shipments
    file: src/pages/expediteur/MyShipmentsPage.tsx
    auth_required: true
    description: List of expediteur's own shipments
  - path: /expediteur/shipments/:id
    file: src/pages/expediteur/ShipmentDetailPage.tsx
    auth_required: true
    description: Expediteur shipment detail, timeline, cancel if PENDING
  - path: /expediteur/invoices
    file: src/pages/expediteur/ExpInvoicesPage.tsx
    auth_required: true
    description: Expediteur invoices
  - path: /expediteur/cod
    file: src/pages/expediteur/ExpCodPage.tsx
    auth_required: true
    description: Expediteur COD balance/history
  - path: /expediteur/profile
    file: src/pages/expediteur/ProfilePage.tsx
    auth_required: true
    description: Expediteur profile page
  - path: /livreur
    file: src/pages/livreur/LivreurHome.tsx
    auth_required: true
    description: Livreur mobile PWA home
  - path: /livreur/jobs
    file: src/pages/livreur/JobsListPage.tsx
    auth_required: true
    description: List of assigned delivery jobs
  - path: /livreur/jobs/:id
    file: src/pages/livreur/JobDetailPage.tsx
    auth_required: true
    description: Job detail, status advance, call log, delivery/failure confirmation
  - path: /livreur/cod
    file: src/pages/livreur/LivCodPage.tsx
    auth_required: true
    description: Livreur COD balance
  - path: /livreur/profile
    file: src/pages/livreur/LivProfilePage.tsx
    auth_required: true
    description: Livreur profile / availability status
  - path: /dispatch
    file: src/pages/dispatch/DispatchHome.tsx
    auth_required: true
    description: Dispatcher home with today stats
  - path: /dispatch/reception
    file: src/pages/dispatch/ReceptionPage.tsx
    auth_required: true
    description: Scan station to receive shipments into warehouse
  - path: /dispatch/tri
    file: src/pages/dispatch/SortPage.tsx
    auth_required: true
    description: Scan station to sort shipments by governorate
  - path: /dispatch/assignation
    file: src/pages/dispatch/AssignPage.tsx
    auth_required: true
    description: Scan station to assign shipments to a livreur
  - path: /dispatch/historique
    file: src/pages/dispatch/ScanHistoryPage.tsx
    auth_required: true
    description: Paginated scan history log
  - path: /finance
    file: src/pages/finance/FinanceHome.tsx
    auth_required: true
    description: Finance overview home (revenue, cash at drivers, unpaid invoices)
  - path: /finance/livreurs
    file: src/pages/finance/LivreurBalancesPage.tsx
    auth_required: true
    description: Livreur COD balances and settlement (reversement)
  - path: /finance/expediteurs
    file: src/pages/finance/ExpediteurCodPage.tsx
    auth_required: true
    description: Expediteur COD due and settlement
  - path: /finance/factures
    file: src/pages/finance/InvoicesPage.tsx
    auth_required: true
    description: Invoice generation, listing, and payment
  - path: /finance/rapports
    file: src/pages/finance/ReportsPage.tsx
    auth_required: true
    description: Finance reports (status breakdown, revenue)
features:
  - name: User Login
    description: Login with email/password, scoped to a role-specific login route (admin, expediteur, livreur, dispatch, finance)
    files:
      - src/pages/auth/LoginPage.tsx
      - src/lib/authQueries.ts
      - src/lib/authStore.ts
    entry_route: /finance/login
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Click login button to submit
      - See error message on invalid credentials
      - Get redirected to role home on success
    api_calls:
      - method: POST
        endpoint: /api/v1/auth/login
      - method: POST
        endpoint: /api/v1/auth/refresh
      - method: GET
        endpoint: /api/v1/auth/me
      - method: POST
        endpoint: /api/v1/auth/logout
    auth_required: false
  - name: Finance overview
    description: FINANCE_MANAGER/SUPER_ADMIN dashboard summarizing revenue, cash held by drivers, COD owed to expediteurs, and invoice status
    files:
      - src/pages/finance/FinanceHome.tsx
      - src/lib/financeQueries.ts
    entry_route: /finance
    user_interactions:
      - Land on /finance after login
      - View KPI tiles (total/monthly revenue, cash at drivers, unpaid invoices)
      - View shipment status breakdown chart
    api_calls:
      - method: GET
        endpoint: /api/v1/finance/overview
      - method: GET
        endpoint: /api/v1/finance/status-breakdown
    auth_required: true
  - name: Livreur COD balances and settlement
    description: View each driver's cash-on-hand balance and record a settlement (full or partial reversement)
    files:
      - src/pages/finance/LivreurBalancesPage.tsx
      - src/lib/financeQueries.ts
    entry_route: /finance/livreurs
    user_interactions:
      - View list of livreurs with non-zero COD balance
      - Click settle action on a livreur
      - Enter optional partial amount, payment method, reference, note
      - Submit settlement and see balance update
      - View settlement history table
    api_calls:
      - method: GET
        endpoint: /api/v1/finance/livreur-balances
      - method: GET
        endpoint: /api/v1/finance/livreur-settlements
      - method: POST
        endpoint: /api/v1/finance/livreur-settle
    auth_required: true
  - name: Expediteur COD due and settlement
    description: View COD amounts owed to each expediteur (gross, commission, net) and settle all outstanding COD for one expediteur
    files:
      - src/pages/finance/ExpediteurCodPage.tsx
      - src/lib/financeQueries.ts
    entry_route: /finance/expediteurs
    user_interactions:
      - View list of expediteurs with net COD owed
      - Click settle action on an expediteur
      - Enter payment method/reference/note
      - Submit settlement, see it disappear/zero out from due list
      - View settlement history table
    api_calls:
      - method: GET
        endpoint: /api/v1/finance/expediteur-cod
      - method: GET
        endpoint: /api/v1/finance/expediteur-settlements
      - method: POST
        endpoint: /api/v1/finance/expediteur-settle
    auth_required: true
  - name: Invoice generation and payment
    description: Generate a flat invoice for an expediteur's non-COD delivered shipments, list invoices, mark an invoice as paid
    files:
      - src/pages/finance/InvoicesPage.tsx
      - src/lib/financeQueries.ts
    entry_route: /finance/factures
    user_interactions:
      - Select expediteur and optional period, generate invoice
      - Filter invoice list by status
      - Click pay action on an unpaid invoice, choose method/reference
      - Confirm payment, see status change to PAID
    api_calls:
      - method: GET
        endpoint: /api/v1/finance/invoiceable/:expediteurId
      - method: POST
        endpoint: /api/v1/finance/invoices/generate
      - method: GET
        endpoint: /api/v1/finance/invoices
      - method: POST
        endpoint: /api/v1/finance/invoices/:id/pay
    auth_required: true
  - name: Finance reports
    description: Status breakdown and revenue reporting for finance role
    files:
      - src/pages/finance/ReportsPage.tsx
      - src/lib/financeQueries.ts
    entry_route: /finance/rapports
    user_interactions:
      - View shipment status breakdown
      - View revenue figures
    api_calls:
      - method: GET
        endpoint: /api/v1/finance/status-breakdown
      - method: GET
        endpoint: /api/v1/finance/overview
    auth_required: true
  - name: Create shipment (Expediteur)
    description: Create a new shipment with live delivery price estimation based on type (Standard/Express) and fragile flag
    files:
      - src/pages/expediteur/CreateShipmentPage.tsx
      - src/lib/shipmentQueries.ts
    entry_route: /expediteur/new
    user_interactions:
      - Fill recipient/address fields
      - Choose shipment type (Standard/Express) and fragile toggle
      - See live price estimate update
      - Submit to create shipment
    api_calls:
      - method: POST
        endpoint: /api/v1/expediteur/shipments/estimate
      - method: POST
        endpoint: /api/v1/expediteur/shipments
    auth_required: true
  - name: My shipments (Expediteur)
    description: List and manage own shipments, cancel while PENDING
    files:
      - src/pages/expediteur/MyShipmentsPage.tsx
      - src/pages/expediteur/ShipmentDetailPage.tsx
      - src/components/expediteur/CancelShipmentModal.tsx
      - src/lib/shipmentQueries.ts
    entry_route: /expediteur/shipments
    user_interactions:
      - View paginated shipment list with status badges
      - Open shipment detail, view timeline
      - Click cancel, enter optional reason, confirm
    api_calls:
      - method: GET
        endpoint: /api/v1/expediteur/shipments
      - method: GET
        endpoint: /api/v1/expediteur/shipments/:id
      - method: POST
        endpoint: /api/v1/expediteur/shipments/:id/cancel
    auth_required: true
  - name: Admin shipment management
    description: Admin-wide shipment listing, detail, and cancellation
    files:
      - src/pages/admin/ShipmentsPage.tsx
      - src/pages/admin/ShipmentDetailPage.tsx
      - src/lib/shipmentQueries.ts
    entry_route: /admin/shipments
    user_interactions:
      - View all shipments across expediteurs
      - Open detail, view expediteur section and timeline
      - Cancel a shipment
    api_calls:
      - method: GET
        endpoint: /api/v1/admin/shipments
      - method: GET
        endpoint: /api/v1/admin/shipments/:id
      - method: POST
        endpoint: /api/v1/admin/shipments/:id/cancel
    auth_required: true
  - name: Driver (livreur) CRUD
    description: Admin management of driver accounts
    files:
      - src/pages/admin/DriversPage.tsx
      - src/lib/livreurQueries.ts
    entry_route: /admin/drivers
    user_interactions:
      - View paginated livreur list
      - Create a new livreur
      - Edit a livreur
      - Delete (soft) a livreur
    api_calls:
      - method: GET
        endpoint: /api/v1/admin/livreurs
      - method: POST
        endpoint: /api/v1/admin/livreurs
      - method: PATCH
        endpoint: /api/v1/admin/livreurs/:id
      - method: DELETE
        endpoint: /api/v1/admin/livreurs/:id
    auth_required: true
  - name: Expediteur CRUD
    description: Admin management of expediteur (sender) accounts
    files:
      - src/pages/admin/ExpediteursPage.tsx
      - src/lib/expediteurQueries.ts
    entry_route: /admin/expediteurs
    user_interactions:
      - View paginated expediteur list
      - Create a new expediteur
      - Edit an expediteur
      - Delete (soft) an expediteur
    api_calls:
      - method: GET
        endpoint: /api/v1/admin/expediteurs
      - method: POST
        endpoint: /api/v1/admin/expediteurs
      - method: PATCH
        endpoint: /api/v1/admin/expediteurs/:id
      - method: DELETE
        endpoint: /api/v1/admin/expediteurs/:id
    auth_required: true
  - name: Livreur PWA jobs
    description: Driver views assigned delivery jobs and advances their status through the delivery lifecycle
    files:
      - src/pages/livreur/JobsListPage.tsx
      - src/pages/livreur/JobDetailPage.tsx
      - src/components/livreur/FailureModal.tsx
      - src/components/livreur/DeliveryConfirmModal.tsx
      - src/lib/jobQueries.ts
    entry_route: /livreur/jobs
    user_interactions:
      - View list of active jobs
      - Open job detail
      - Log a call outcome (answered/no answer/wrong number/rescheduled)
      - Advance status (picked up, in transit, out for delivery, delivered)
      - Mark delivery failed with a required note
      - Confirm COD collected when marking delivered with COD
    api_calls:
      - method: GET
        endpoint: /api/v1/livreur/jobs
      - method: GET
        endpoint: /api/v1/livreur/jobs/:id
      - method: PATCH
        endpoint: /api/v1/livreur/jobs/:id/status
      - method: POST
        endpoint: /api/v1/livreur/jobs/:id/call
    auth_required: true
  - name: Dispatcher warehouse scanning
    description: Warehouse operator scans shipments through reception, sorting, and assignment to a driver
    files:
      - src/pages/dispatch/DispatchHome.tsx
      - src/pages/dispatch/ReceptionPage.tsx
      - src/pages/dispatch/SortPage.tsx
      - src/pages/dispatch/AssignPage.tsx
      - src/pages/dispatch/ScanHistoryPage.tsx
      - src/lib/dispatcherQueries.ts
    entry_route: /dispatch
    user_interactions:
      - View today stats (received/sorted/assigned, total at warehouse)
      - Scan a tracking number to receive a shipment
      - Scan to sort by governorate
      - Scan to assign to an available livreur
      - View paginated scan history
    api_calls:
      - method: GET
        endpoint: /api/v1/dispatch/me
      - method: POST
        endpoint: /api/v1/dispatch/scan/receive
      - method: POST
        endpoint: /api/v1/dispatch/scan/sort
      - method: GET
        endpoint: /api/v1/dispatch/livreurs
      - method: POST
        endpoint: /api/v1/dispatch/scan/assign
      - method: GET
        endpoint: /api/v1/dispatch/scans
    auth_required: true
known_limitations:
  - issue: Admin pages Customers, Warehouses, Cod, Invoices, Reports, Support, Settings may use mock/static data rather than live backend endpoints
    location: src/pages/admin/*.tsx
    impact: Admin dashboard stats and some admin sub-pages are not yet wired to real API data
  - issue: COD management API (CodCollection lifecycle) is not implemented as a dedicated service
    location: server/src/services
    impact: Finance modules operate directly on Livreur.codBalance and Shipment fields instead of a full CodCollection audit trail
  - issue: Detailed line-item invoicing (InvoiceItem, Payment models) is unused
    location: server/src/services/invoice.service.ts
    impact: Invoices are flat single-amount records, not itemized
